<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人格羅盤 — 解析風土，策展頻率</title>
<style>
:root {
  --bg: #0a0a0a;
  --card: #141414;
  --border: rgba(255,255,255,0.08);
  --text: rgba(255,255,255,0.88);
  --text2: rgba(255,255,255,0.55);
  --text3: rgba(255,255,255,0.28);
  --accent: #c8913a;
  --input-bg: #1a1a1a;
--btn-bg: #1a1a1a;
--btn-hover: #222;
--radius: 12px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'PingFang TC','Noto Sans SC','Microsoft YaHei',sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; line-height: 1.7;
}
.container { max-width: 680px; margin: 0 auto; padding: 24px 16px 60px; }

/* Header */
.header { text-align: center; padding: 32px 0 20px; }
.header h1 { font-size: 28px; letter-spacing: 6px; font-weight: 700; color: var(--text); }
.header .sub { font-size: 13px; color: var(--text3); letter-spacing: 8px; margin-top: 6px; }
.header .brand { font-size: 12px; color: var(--text3); letter-spacing: 4px; margin-top: 4px; }

/* Card */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
.card-title { font-size: 15px; font-weight: 600; margin-bottom: 14px; letter-spacing: 2px; color: var(--text); }

/* Form */
.form-row { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
.form-group { flex: 1; min-width: 140px; }
.form-group label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 5px; letter-spacing: 1px; }
.form-group input, .form-group select {
  width: 100%; padding: 10px 12px; font-size: 15px;
  background: var(--input-bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px;
  font-family: inherit; outline: none;
}
.form-group input:focus, .form-group select:focus { border-color: var(--accent); }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 10px 20px; font-size: 15px; font-weight: 600;
  border: none; border-radius: 8px; cursor: pointer;
  font-family: inherit; letter-spacing: 2px;
  transition: all 0.2s; text-decoration: none;
}
.btn-primary { background: var(--accent); color: #000; width: 100%; }
.btn-primary:hover { opacity: 0.85; }
.btn-outline { background: var(--btn-bg); color: var(--text); border: 1px solid var(--border); }
.btn-outline:hover { background: var(--btn-hover); }

/* Tags */
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.tag { font-size: 12px; padding: 3px 10px; border-radius: 20px; background: rgba(255,255,255,0.05); color: var(--text2); letter-spacing: 1px; }

/* Tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; overflow-x: auto; }
.tab-btn { padding: 8px 16px; font-size: 13px; background: none; border: none; color: var(--text2); cursor: pointer; font-family: inherit; white-space: nowrap; letter-spacing: 1px; border-bottom: 2px solid transparent; transition: all 0.2s; }
.tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }

/* Content */
.prose { font-size: 14px; color: var(--text); line-height: 1.9; }
.prose h3 { font-size: 16px; color: var(--text); margin: 16px 0 8px; font-weight: 600; }
.prose strong { color: var(--text); }
.prose p { margin-bottom: 6px; }

/* Radar */
.radar-wrap { display: flex; justify-content: center; padding: 8px 0 16px; }
.radar-wrap svg { max-width: 100%; }

/* Color palette */
.palette { display: flex; flex-direction: column; gap: 10px; margin: 12px 0; }
.palette-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: rgba(255,255,255,0.03); border-radius: 8px; }
.palette-swatch { width: 40px; height: 40px; border-radius: 8px; flex-shrink: 0; }
.palette-name { font-weight: 600; font-size: 14px; }
.palette-src { font-size: 11px; color: var(--text3); }
.palette-meaning { font-size: 13px; color: var(--text2); margin-top: 2px; }

/* Story card preview */
.story-preview { text-align: center; margin: 12px 0; }
.story-preview img { max-width: 100%; border-radius: 8px; border: 1px solid var(--border); }

/* Footer */
.footer { text-align: center; padding: 20px 0; font-size: 11px; color: var(--text3); letter-spacing: 4px; }

/* Loading */
.spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Responsive */
@media (max-width: 480px) {
  .form-row { flex-direction: column; }
  .btn-outline { width: 100%; }
  .header h1 { font-size: 22px; }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>人格羅盤</h1>
    <div class="sub">解析風土 · 策展頻率</div>
    <div class="brand">The Terroir Curator</div>
  </div>

    <div class="card-title">輸入你的出生資料</div>

      <div class="form-group">

        <input type="date" id="birthday" value="1995-06-15" min="1900-01-01" max="2026-12-31">
      </div>
      <div class="form-group" style="min-width:100px">

        <select id="bloodType">

          <option value="B">B 型</option>

          <option value="O">O 型</option>

    <div style="margin-top:14px">
      <button class="btn btn-primary" id="analyzeBtn" onclick="analyze()">
        開始分析
      </button>
    </div>
    <div id="inputError" style="color:#e55;font-size:13px;margin-top:8px;display:none"></div>
  </div>

  <!-- Results -->
  <div id="results" style="display:none">

    <!-- Tags -->
    <div class="tags" id="dimTags"></div>

    <!-- Radar -->
    <div class="card">
      <div class="card-title" style="text-align:center">人格羅盤</div>
      <div class="radar-wrap" id="radarChart"></div>
    </div>

    <!-- Analysis Tabs -->
    <div class="card">
      <div class="tabs" id="tabs">
        <button class="tab-btn active" onclick="switchTab('personality')">性格剖析</button>
        <button class="tab-btn" onclick="switchTab('career')">生涯建議</button>
        <button class="tab-btn" onclick="switchTab('color')">色彩光譜</button>
        <button class="tab-btn" onclick="switchTab('fun')">趣味總結</button>
      </div>
      <div class="prose" id="tabContent"></div>
    </div>

    <!-- Export Buttons -->
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-outline" onclick="exportPDF()">📄 下載 PDF 報告</button>
      <button class="btn btn-outline" onclick="exportStoryCard()">📱 下載限動小卡</button>
    </div>
  </div>

  <div class="footer">人格羅盤 · The Terroir Curator</div>
</div>

const LUNAR_BASE_DATE = new Date(1900,0,31);
function getLeapMonth(y){ return LUNAR_INFO[y-1900]&0xf; }
function getLeapMonthDays(y){ if(getLeapMonth(y)){ return (LUNAR_INFO[y-1900]&0x10000)?30:29; } return 0; }
function getMonthDays(y,m){ return (LUNAR_INFO[y-1900]&(0x10000>>m))?30:29; }
function getLunarYearDays(y){ let s=348; for(let i=0x8000;i>0x8;i>>=1) s+=(LUNAR_INFO[y-1900]&i)?1:0; return s+getLeapMonthDays(y); }
function solarToLunar(date){
  const base=new Date(LUNAR_BASE_DATE);
  let offset=Math.floor((date.getTime()-base.getTime())/86400000),lunarYear=1900;
  for(let i=1900;i<2100&&offset>0;i++){ const yd=getLunarYearDays(i); if(offset<yd){ lunarYear=i; break; } offset-=yd; lunarYear=i; }
  const leap=getLeapMonth(lunarYear); let isLeap=false,lunarMonth=1;
  for(let m=1;m<=12&&offset>0;m++){
    if(leap>0&&m===leap+1&&!isLeap){ --m; isLeap=true; } else { isLeap=false; }
    const md=isLeap?getLeapMonthDays(lunarYear):getMonthDays(lunarYear,m);
    if(offset<md){ lunarMonth=m; break; } offset-=md; lunarMonth=m;
  }
  return { year:lunarYear, month:lunarMonth, day:offset+1, isLeap };

function calculateScores(animal, sign, blood, mansion, month, stem, lifePath){
  const ad=ZODIAC_ANIMAL_DATA[animal], sd=ZODIAC_SIGN_DATA[sign], bd=BLOOD_TYPE_DATA[blood], md=LUNAR_MANSION_DATA[mansion], mod=MONTH_ORDER_DATA[month], std=HEAVENLY_STEM_DATA[stem], lpd=LIFE_PATH_DATA[lifePath];
  const lpEl=lpd?lpd.element:'';
  const bloodEl=(blood==='A'||blood==='AB')?'水':(blood==='B')?'風':'火';
  const dims=[
    {el:ad.element,w:0.17},{el:sd.element,w:0.17},{el:bloodEl,w:0.09},
    {el:md.element,w:0.15},{el:mod.element,w:0.09},{el:std.element,w:0.15},{el:lpEl,w:0.18}
  ];
  const maps={
    leadership:{'火':85,'金':70,'木':60,'土':50,'水':40,'風':50,'':55},
    creativity:{'風':85,'水':75,'火':70,'木':60,'金':50,'土':40,'':60},
    stability:{'土':90,'金':75,'水':55,'木':45,'火':35,'風':45,'':60},
    sociability:{'風':85,'火':75,'水':60,'木':55,'土':45,'金':50,'':60},
    sensitivity:{'水':90,'土':65,'木':60,'風':55,'火':40,'金':35,'':55},
    execution:{'火':90,'金':80,'木':70,'風':55,'土':45,'水':35,'':55},
    insight:{'水':90,'火':75,'風':65,'木':55,'金':45,'土':35,'':50}
  };
  function w(m){ let s=0; for(const d of dims) s+=(m[d.el]??55)*d.w; return Math.round(s); }
  return {leadership:w(maps.leadership),creativity:w(maps.creativity),stability:w(maps.stability),sociability:w(maps.sociability),sensitivity:w(maps.sensitivity),execution:w(maps.execution),insight:w(maps.insight)};
}

function generateSoulPalette(zodiacAnimal,zodiacSign,bloodType,heavenlyStem,lifePathNumber){

  const elNames={'木':'森綠','火':'赤焰','土':'琥珀','金':'銀灰','水':'深海','風':'薰紫'};

    palette.push({hex:ELEMENT_COLORS[animalEl],name:elNames[animalEl]||animalEl,meaning:elMeaning[animalEl]||'',source:'生肖本質'});
  }
  const signEl=signElMap[zodiacSign];

    palette.push({hex:ELEMENT_COLORS[signEl],name:elNames[signEl]||signEl,meaning:elMeaning[signEl]||'',source:'情感風格'});
  }
  if(heavenlyStem&&STEM_COLOR[heavenlyStem]){
    const sd=HEAVENLY_STEM_DATA[heavenlyStem];
    palette.push({hex:STEM_COLOR[heavenlyStem],name:heavenlyStem+'木綠',meaning:sd?sd.description.slice(0,30):'',source:'年柱核心'});

    palette.push({hex:BLOOD_COLOR[bloodType],name:bloodType+'型',meaning:bd?bd.description.slice(0,30):'',source:'氣質底色'});
  }
  return palette;
}

function renderRadarChart(scores){
  const labels=['領導力','創造力','穩定性','社交力','感受力','執行力','洞察力'];
  const values=[scores.leadership,scores.creativity,scores.stability,scores.sociability,scores.sensitivity,scores.execution,scores.insight];
  const n=values.length, size=260, cx=size/2, cy=size/2, r=size/2-40;
  const angles=labels.map((_,i)=>(Math.PI*2*i/n)-Math.PI/2);
  let svg='<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">';
  // Grid
  for(let l=1;l<=3;l++){
    const lr=r*l/3;
    let pts=''; for(let i=0;i<n;i++) pts+=(cx+lr*Math.cos(angles[i]))+','+(cy+lr*Math.sin(angles[i]))+' ';
    svg+='<polygon points="'+pts+'" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>';
  }
  // Axes
  for(let i=0;i<n;i++){
    svg+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+r*Math.cos(angles[i]))+'" y2="'+(cy+r*Math.sin(angles[i]))+'" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>';
  }
  // Data polygon
  let dpts=''; for(let i=0;i<n;i++) dpts+=(cx+r*values[i]/100*Math.cos(angles[i]))+','+(cy+r*values[i]/100*Math.sin(angles[i]))+' ';
  svg+='<polygon points="'+dpts+'" fill="rgba(200,145,58,0.15)" stroke="#c8913a" stroke-width="1.5"/>';
  // Dots + Labels
  for(let i=0;i<n;i++){
    const x=cx+r*values[i]/100*Math.cos(angles[i]), y=cy+r*values[i]/100*Math.sin(angles[i]);
    svg+='<circle cx="'+x+'" cy="'+y+'" r="3" fill="#c8913a"/>';
    const lx=cx+(r+28)*Math.cos(angles[i]), ly=cy+(r+28)*Math.sin(angles[i]);
    svg+='<text x="'+lx+'" y="'+ly+'" text-anchor="middle" dominant-baseline="central" fill="rgba(255,255,255,0.6)" font-size="11" font-family="sans-serif">'+labels[i]+'</text>';
    svg+='<text x="'+lx+'" y="'+(ly+14)+'" text-anchor="middle" dominant-baseline="central" fill="rgba(255,255,255,0.35)" font-size="10" font-family="sans-serif">'+values[i]+'</text>';
  }
  svg+='</svg>';
  return svg;
}

  return '<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'"><rect width="'+W+'" height="'+H+'" fill="#000000"/><text x="80" y="72" fill="'+C.tertiary+'" font-size="22" font-family="sans-serif" letter-spacing="8">人格羅盤</text><text x="1000" y="72" text-anchor="end" fill="'+C.tertiary+'" font-size="22" font-family="sans-serif" letter-spacing="4">TTC</text><line x1="80" y1="92" x2="1000" y2="92" stroke="'+C.line+'" stroke-width="1"/><text x="1000" y="140" text-anchor="end" fill="'+C.secondary+'" font-size="24" font-family="sans-serif" letter-spacing="3">'+esc(data.monthOrder)+'生 · '+esc(data.bloodType)+'型</text><text x="80" y="225" fill="'+C.primary+'" font-size="64" font-family="sans-serif" font-weight="700" letter-spacing="6">'+esc(data.name)+'</text><text x="80" y="280" fill="'+C.secondary+'" font-size="24" font-family="sans-serif" letter-spacing="3">'+esc(data.stemBranch)+'年 · '+esc(data.zodiacAnimal)+' · '+esc(data.zodiacSign)+' · '+esc(data.lunarMansion)+' · 靈數'+data.lifePathNumber+'</text><line x1="450" y1="420" x2="630" y2="420" stroke="'+accent+'" stroke-width="1" opacity="0.35"/>'+titleSVG+'<line x1="470" y1="810" x2="610" y2="810" stroke="'+accent+'" stroke-width="1" opacity="0.35"/>'+chipSVG+'<line x1="180" y1="1320" x2="900" y2="1320" stroke="'+C.line+'" stroke-width="1"/><text x="540" y="1358" text-anchor="middle" fill="'+C.tertiary+'" font-size="15" font-family="sans-serif" letter-spacing="10">SOUL SPECTRUM</text>'+paletteDots+'<line x1="280" y1="1420" x2="800" y2="1420" stroke="'+C.line+'" stroke-width="1"/><text x="540" y="1460" text-anchor="middle" fill="'+C.tertiary+'" font-size="18" font-family="sans-serif" letter-spacing="10">HIDDEN SKILL</text>'+skillSVG+'<line x1="280" y1="1800" x2="800" y2="1800" stroke="'+C.line+'" stroke-width="1"/><text x="540" y="1840" text-anchor="middle" fill="'+C.tertiary+'" font-size="18" font-family="sans-serif" letter-spacing="6">✦ 解析風土 · 策展頻率 ✦</text><text x="540" y="1872" text-anchor="middle" fill="rgba(255,255,255,0.14)" font-size="16" font-family="sans-serif" letter-spacing="4">人格羅盤 · The Terroir Curator</text></svg>';

let analysisResult=null, currentTab='personality';

function analyze(){
  const birthday=document.getElementById('birthday').value;
  const bloodType=document.getElementById('bloodType').value;
  const errEl=document.getElementById('inputError');
  if(!birthday){ errEl.textContent='請輸入國曆生日'; errEl.style.display='block'; return; }
  const year=parseInt(birthday.split('-')[0],10);
  if(isNaN(year)||year<1900||year>2026){ errEl.textContent='請輸入有效年份（1900–2026）'; errEl.style.display='block'; return; }
  if(!bloodType){ errEl.textContent='請選擇血型'; errEl.style.display='block'; return; }
  errEl.style.display='none';
  try{
    const dims=calculateAll(birthday,bloodType);
    const result=generateAnalysis(dims);
    result.dims=dims;
    analysisResult=result;
    document.getElementById('results').style.display='block';
    // Tags
    document.getElementById('dimTags').innerHTML=[
      {l:'天干地支',v:dims.stemBranch},{l:'生肖',v:dims.zodiacAnimal},{l:'星座',v:dims.zodiacSign},
      {l:'血型',v:bloodType+' 型'},{l:'星宿',v:dims.lunarMansion},{l:'月令',v:dims.monthOrder},{l:'生命靈數',v:String(dims.lifePathNumber)}
    ].map(d=>'<span class="tag">'+d.l+' '+d.v+'</span>').join('');
    // Radar
    document.getElementById('radarChart').innerHTML=renderRadarChart(result.scores);
    // Tab
    switchTab('personality');
    document.getElementById('results').scrollIntoView({behavior:'smooth'});
  }catch(e){ errEl.textContent=e.message; errEl.style.display='block'; }
}

function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  const a=analysisResult; if(!a) return;
  let html='';
  if(tab==='personality'){
    html='<p>'+a.overview+'</p><hr style="border-color:rgba(255,255,255,0.06);margin:16px 0"/>'+a.personality.split('\n').map(l=>l.startsWith('### ')?'<h3>'+l.slice(4)+'</h3>':l.startsWith('▸')?'<p>'+l+'</p>':'<p>'+l+'</p>').join('')+'<hr style="border-color:rgba(255,255,255,0.06);margin:16px 0"/><h3>行為模式</h3><p>'+a.behavior+'</p><hr style="border-color:rgba(255,255,255,0.06);margin:16px 0"/><h3>人際關係</h3><p>'+a.relationships+'</p>';
  }else if(tab==='career'){
    html=a.careerAdvice.split('\n').map(l=>l.startsWith('### ')?'<h3>'+l.slice(4)+'</h3>':l.startsWith('**')&&l.includes('**')?('<p><strong>'+l.replace(/\*\*/g,'')+'</strong></p>'):'<p>'+l+'</p>').join('');
  }else if(tab==='color'){
    html='<p>每個人都有專屬的色彩頻率——你的七維人格在可見光譜上的投影。</p><div class="palette">';
    for(const c of a.palette){
      html+='<div class="palette-item"><div class="palette-swatch" style="background:'+c.hex+'"></div><div><div class="palette-name">'+c.name+' <code style="font-size:12px;color:var(--text2)">'+c.hex+'</code> <span class="palette-src">'+(SOURCE_EMOJI[c.source]||'')+' '+c.source+'</span></div><div class="palette-meaning">'+c.meaning+'</div></div></div>';
    }
    html+='</div>';
  }else if(tab==='fun'){
    html=a.funSummary.split('\n\n').map(p=>'<p>'+p+'</p>').join('');
  }
  document.getElementById('tabContent').innerHTML=html;
}

function exportPDF(){ window.print(); }

function exportStoryCard(){
  const a=analysisResult; if(!a) return;
  const els={'鼠':'水','牛':'土','虎':'木','兔':'木','龍':'土','蛇':'火','馬':'火','羊':'土','猴':'金','雞':'金','狗':'土','豬':'水'};
  const animalEl=els[a.dims.zodiacAnimal]||'水';
  const movieMatch=a.funSummary.match(/《(.+?)》/),movieTitle=movieMatch?movieMatch[1]:'獨一無二的靈魂旅程';
  const skillMatch=a.funSummary.match(/隱藏技能[：:]\s*(.+)/),hiddenSkill=skillMatch?skillMatch[1].trim():'';
  const paletteHexes=a.palette.map(c=>c.hex);
  const svgString=generateStoryCardSVG({
    name:a.dims.zodiacAnimal+a.dims.zodiacSign+a.dims.bloodType+'型',stemBranch:a.dims.stemBranch,zodiacAnimal:a.dims.zodiacAnimal,zodiacSign:a.dims.zodiacSign,bloodType:a.dims.bloodType+' 型',lunarMansion:a.dims.lunarMansion,monthOrder:a.dims.monthOrder,lifePathNumber:a.dims.lifePathNumber,movieTitle,coreTraits:a.coreTraits,hiddenSkill,elementColor:animalEl,paletteHexes
  });
  const svgBlob=new Blob([svgString],{type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(svgBlob);
  const img=new Image();
  img.onload=()=>{
    const canvas=document.createElement('canvas');
    canvas.width=img.width; canvas.height=img.height;
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0);
    URL.revokeObjectURL(url);
    canvas.toBlob(b=>{
      const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='人格羅盤小卡.png'; a.click();
    },'image/png');
  };
  img.src=url;
}
